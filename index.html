    <style>
        :root { --primary: #1e110a; --accent: #c2410c; --bg-all: #fef2f2; --txt-all: #991b1b; }
        body { font-family: system-ui, sans-serif; background: #f9fafb; color: #1f2937; margin: 0; padding: 20px 10px; }
        .ad-container { max-width: 1200px; margin: 0 auto; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); padding: 20px; border: 1px solid #f3f4f6; }
        .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #f3f4f6; }
        .lang-select { padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; font-weight: 600; }
        .brand-header { text-align: center; margin-bottom: 40px; }
        .logo-title { font-size: 38px; font-weight: 800; letter-spacing: 0.05em; color: var(--accent); margin: 0; }
        .logo-subtitle { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--primary); }
        .logo-services { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #4b5563; margin-top: 10px; }
        .header-catalogo p { color: #6b7280; font-size: 14px; margin-top: 15px; }
        .catalog-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media (min-width: 600px) { .catalog-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .catalog-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1200px) { .catalog-grid { grid-template-columns: repeat(4, 1fr); } }
        .product-card { background: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #e5e7eb; display: flex; flex-direction: column; }
        .image-container { width: 100%; height: 220px; background: #fafafa; }
        .product-image { width: 100%; height: 100%; object-fit: cover; }
        .product-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-subtitle { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
        .product-title { font-size: 18px; font-weight: 700; color: var(--primary); margin: 0 0 10px 0; }
        .product-description { font-size: 13.5px; line-height: 1.5; color: #4b5563; margin-bottom: 16px; }
        .allergeni-box { background: var(--bg-all); border: 1px solid #fee2e2; border-radius: 8px; padding: 10px 12px; margin-top: auto; }
        .allergeni-title { font-size: 11px; font-weight: 700; color: var(--txt-all); text-transform: uppercase; margin-bottom: 4px; }
        .allergeni-list { font-size: 11.5px; color: #7f1d1d; margin: 0; }
    </style>
</head>

        function renderGrid(lang) {
            const container = document.getElementById("grid-container");
            container.innerHTML = "";
            document.getElementById("mainDesc").innerText = translations[lang].mainDesc;

                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <div class="image-container"><img src="${item.img}" alt="Pralina" class="product-image"></div>
                    <div class="product-content">
                        <div class="product-subtitle">${translations[lang][item.tag]}</div>
                        <h2 class="product-title">${translations[lang][item.t]}</h2>
                        <p class="product-description">${translations[lang][item.d]}</p>
                        <div class="allergeni-box">
                            <div class="allergeni-title">${translations[lang].allLabel}</div>
                            <p class="allergeni-list">${translations[lang][item.a]}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
